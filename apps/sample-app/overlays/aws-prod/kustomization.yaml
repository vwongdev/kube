apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../providers/aws

patches:
  - target:
      kind: HTTPRoute
      name: route
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - api.vwong.dev

images:
  - name: app
    newName: 788455525284.dkr.ecr.us-east-1.amazonaws.com/kube
    newTag: latest