apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../providers/gcp

patches:
  - target:
      kind: Ingress
      name: ingress
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: gcp.vwong.dev
      - op: add
        path: /metadata/annotations/ingress.gcp.kubernetes.io~1pre-shared-cert
        value: gcp-vwong-dev-cert

images:
  - name: app
    newName: us-east1-docker.pkg.dev/vwongdev-kube/kube/sample-app
    newTag: latest
