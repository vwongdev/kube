apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../providers/gcp

patches:
  - target:
      kind: HTTPRoute
      name: route
    patch: |-
      - op: add
        path: /spec/hostnames
        value:
          - gcp.vwong.dev

images:
  - name: app
    newName: us-west4-docker.pkg.dev/vwongdev-kube/kube/sample-app
    newTag: latest
