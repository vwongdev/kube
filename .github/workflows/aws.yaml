name: Deploy to Amazon Web Services

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-aws:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        environment: [ prod ]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/PrimaryPipelineRole
          role-session-name: github-workflows-session
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install deployment dependencies
        run: |
          curl --silent --location "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
      - run: |
          aws cloudformation deploy \
            --stack-name bootstrap \
            --template-file providers/aws/bootstrap.yaml \
            --parameter-overrides OrgName=${{ github.repository_owner }} OrgId=${{ github.repository_owner_id }} RepoName=${{ github.event.repository.name }} RepoId=${{ github.repository_id }} \
            --capabilities CAPABILITY_NAMED_IAM
      - run: |
          terraform init \
            -backend-config="bucket=tf-state-bucket-${{ vars.AWS_ACCOUNT }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=tf-state-table"
        working-directory: providers/aws
      - run: |
          terraform apply -auto-approve \
            -var-file="env/${{ matrix.environment }}.tfvars" \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="domain=${{ vars.API_DOMAIN }}"
        working-directory: providers/aws
      - run: aws eks update-kubeconfig --name "$(terraform -chdir=providers/aws output -raw cluster_name)" --region ${{ vars.AWS_REGION }}
      - run: sh bootstrap/install-argocd.sh
      - run: |
          sed -i "s|\$GH_TOKEN|${GH_TOKEN}|g" bootstrap/base/secret.yaml
          kubectl apply -k bootstrap/overlays/aws-${{ matrix.environment }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: docker build apps/sample-app -t "$(terraform -chdir=providers/aws output -raw repository_url)"
      - run: ./providers/aws/scripts/push-app-image.sh "$(terraform -chdir=providers/aws output -raw repository_url)"
      - run: terraform output
        working-directory: providers/aws