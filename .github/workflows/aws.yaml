name: Deploy to Amazon Web Services

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-to-aws:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        environment: [ prod ]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - id: config
        run: yq '.aws.${{ matrix.environment }} | to_entries | .[] | .key + "=" + .value' providers/config.yaml >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.config.outputs.account }}:role/PrimaryPipelineRole
          role-session-name: github-workflows-session
          aws-region: ${{ steps.config.outputs.region }}
      - name: Install deployment dependencies
        run: |
          curl --silent --location "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
      - run: |
          aws cloudformation deploy \
            --stack-name bootstrap \
            --template-file providers/aws/bootstrap.yaml \
            --parameter-overrides OrgName=${{ github.repository_owner }} OrgId=${{ github.repository_owner_id }} RepoName=${{ github.event.repository.name }} RepoId=${{ github.repository_id }} \
            --capabilities CAPABILITY_NAMED_IAM
      - run: |
          terraform init \
            -backend-config="bucket=tf-state-bucket-${{ steps.config.outputs.account }}" \
            -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ steps.config.outputs.region }}" \
            -backend-config="dynamodb_table=tf-state-table"
        working-directory: providers/aws
      - run: |
          terraform apply -auto-approve \
            -var="region=${{ steps.config.outputs.region }}" \
            -var="domain=${{ steps.config.outputs.domain }}" \
            -var="cluster_name=${{ steps.config.outputs.cluster_name }}" \
            -var="repository_name=${{ steps.config.outputs.repository_name }}"
        working-directory: providers/aws
      - run: aws eks update-kubeconfig --name "$(terraform -chdir=providers/aws output -raw cluster_name)" --region ${{ steps.config.outputs.region }}
      - run: sh bootstrap/install-argocd.sh
      - run: |
          sed -i "s|\$GH_TOKEN|${GH_TOKEN}|g" bootstrap/base/secret.yaml
          kubectl apply -k bootstrap/overlays/aws-${{ matrix.environment }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: docker build apps/sample-app -t "$(terraform -chdir=providers/aws output -raw repository_url)"
      - run: ./providers/aws/scripts/push-app-image.sh "$(terraform -chdir=providers/aws output -raw repository_url)"
      - run: terraform output
        working-directory: providers/aws