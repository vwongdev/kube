name: Publish image

# Called by organisation repositories to push images to ECR and Artifact Registry.
# Callers must grant `id-token: write`. Images are tagged <registry>/<calling repository>/<image>:<commit>.
on:
  workflow_call:
    inputs:
      images:
        description: 'JSON list of images to build, e.g. [{"image": "app", "context": "."}]'
        type: string
        required: true

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      aws_account: ${{ steps.aws.outputs.account }}
      aws_region: ${{ steps.aws.outputs.region }}
      gcp_project: ${{ steps.gcp.outputs.project }}
      gcp_project_number: ${{ steps.gcp.outputs.project_number }}
      gcp_region: ${{ steps.gcp.outputs.region }}
      gcp_repository: ${{ steps.gcp.outputs.repository_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: VWongDev/kube
          sparse-checkout: providers/config.yaml
          sparse-checkout-cone-mode: false
      - id: aws
        run: yq '.aws.prod | to_entries | .[] | .key + "=" + .value' providers/config.yaml >> "$GITHUB_OUTPUT"
      - id: gcp
        run: yq '.gcp.prod | to_entries | .[] | .key + "=" + .value' providers/config.yaml >> "$GITHUB_OUTPUT"

  publish-aws:
    needs: config
    runs-on: ubuntu-24.04
    # TODO: Remove once AWS role assumption from GitHub OIDC is fixed
    continue-on-error: true
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    env:
      REGISTRY: ${{ needs.config.outputs.aws_account }}.dkr.ecr.${{ needs.config.outputs.aws_region }}.amazonaws.com
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ needs.config.outputs.aws_account }}:role/RegistryPushRole
          role-session-name: github-registry-push
          aws-region: ${{ needs.config.outputs.aws_region }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.event.repository.name }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-gcp:
    needs: config
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.images) }}
    env:
      PROJECT: ${{ needs.config.outputs.gcp_project }}
      REGISTRY: ${{ needs.config.outputs.gcp_region }}-docker.pkg.dev
    steps:
      - uses: actions/checkout@v7
      - id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ needs.config.outputs.gcp_project_number }}/locations/global/workloadIdentityPools/github-registry/providers/github
          service_account: registry-push@${{ env.PROJECT }}.iam.gserviceaccount.com
          token_format: access_token
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ needs.config.outputs.gcp_repository }}/${{ github.event.repository.name }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
