name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-gcp:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        environment: [ prod ]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: primary-pipeline@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      # The deployment location only holds Infrastructure Manager metadata; resources use the input region
      - run: |
          gcloud infra-manager deployments apply \
            projects/${{ vars.GCP_PROJECT }}/locations/us-central1/deployments/bootstrap \
            --service-account projects/${{ vars.GCP_PROJECT }}/serviceAccounts/infra-manager@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com \
            --local-source providers/gcp/bootstrap \
            --input-values project=${{ vars.GCP_PROJECT }},region=${{ vars.GCP_REGION }},org_name=${{ github.repository_owner }},repo_name=${{ github.event.repository.name }}
      - run: |
          terraform init \
            -backend-config="bucket=tf-state-bucket-${{ vars.GCP_PROJECT }}" \
            -backend-config="prefix=${{ matrix.environment }}"
        working-directory: providers/gcp
      - run: |
          terraform apply -auto-approve \
            -var-file="env/${{ matrix.environment }}.tfvars" \
            -var="project=${{ vars.GCP_PROJECT }}" \
            -var="region=${{ vars.GCP_REGION }}" \
            -var="admin_email=${{ vars.GCP_ADMIN_EMAIL }}"
        working-directory: providers/gcp
      - run: docker build apps/sample-app -t "$(terraform -chdir=providers/gcp output -raw repository_url)/sample-app"
      - run: ./providers/gcp/scripts/push-app-image.sh "$(terraform -chdir=providers/gcp output -raw repository_url)/sample-app"
      - run: terraform output
        working-directory: providers/gcp
