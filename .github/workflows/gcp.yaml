name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-to-gcp:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        environment: [ prod ]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
      - id: config
        run: yq '.gcp.${{ matrix.environment }} | to_entries | .[] | .key + "=" + .value' providers/config.yaml >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ steps.config.outputs.project_number }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: primary-pipeline@${{ steps.config.outputs.project }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin
      # The deployment location only holds Infrastructure Manager metadata; resources use the input region
      - run: |
          gcloud infra-manager deployments apply \
            projects/${{ steps.config.outputs.project }}/locations/us-central1/deployments/bootstrap \
            --service-account projects/${{ steps.config.outputs.project }}/serviceAccounts/infra-manager@${{ steps.config.outputs.project }}.iam.gserviceaccount.com \
            --local-source providers/gcp/bootstrap \
            --input-values project=${{ steps.config.outputs.project }},region=${{ steps.config.outputs.region }},org_name=${{ github.repository_owner }},org_id=${{ github.repository_owner_id }},repo_name=${{ github.event.repository.name }},repo_id=${{ github.repository_id }}
      - run: providers/scripts/terraform-init.sh gcp.${{ matrix.environment }}
      - run: providers/scripts/terraform.sh gcp.${{ matrix.environment }} apply -auto-approve
        env:
          GCP_ADMIN_EMAIL: ${{ vars.GCP_ADMIN_EMAIL }}
      - run: gcloud container clusters get-credentials "$(terraform -chdir=providers/gcp output -raw cluster_name)" --location ${{ steps.config.outputs.zone }}
      - run: sh bootstrap/install-argocd.sh
      - run: |
          sed -i "s|\$GH_TOKEN|${GH_TOKEN}|g" bootstrap/base/secret.yaml
          kubectl apply -k bootstrap/overlays/gcp-${{ matrix.environment }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - run: docker build apps/sample-app -t "$(terraform -chdir=providers/gcp output -raw repository_url)/sample-app"
      - run: ./providers/gcp/scripts/push-app-image.sh "$(terraform -chdir=providers/gcp output -raw repository_url)/sample-app"
      - run: terraform output
        working-directory: providers/gcp
