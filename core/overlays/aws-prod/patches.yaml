apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        clusterName: kube-cluster
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  source:
    helm:
      valuesObject:
        txtOwnerId: kube-cluster
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secrets
spec:
  provider:
    aws:
      region: us-east-1
